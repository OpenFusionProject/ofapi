<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .get-button {
        display: inline-block;
        padding: 10px 20px;
        background-color: #00b536;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-bottom: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 20px;
      }

      #banner {
        background-color: #00b536;
        background-image: url('$BANNER_URL$');
        background-size: cover;
        background-position: center;
        color: white;
        padding: 10px;
        font-size: 28px;
        height: 40px;
        line-height: 40px;
      }

      #banner img {
        height: 90%;
      }
    </style>
  </head>
  <body onload="window.navigation.navigate('$LAUNCH_URI$')">
    <div id="banner">
      <img src="$LOGO_URL$" alt="$SERVER_NAME$" />
    </div>
    <div id="content">
      <h2>Launching with OpenFusionLauncher...</h2>
      <p>You should see a popup to open OpenFusionLauncher. If not, <a href="$LAUNCH_URI$">click here.</a></p>
      <br />
      <p>Still not working? You'll need to install OpenFusionLauncher v2.3.0 or later.</p>
      <p>You can get it from the official website:</p>
      <a class="get-button" href="https://openfusion.dev/download/">Get OpenFusionLauncher</a>
      <br />
      <a href="$PRIVACY_POLICY_URL$">Privacy Policy</a>
    </div>
  </body>
</html>
